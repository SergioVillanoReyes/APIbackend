name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 10 & SQL Server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore APIbackend.slnx

      - name: Build solution (Release)
        run: dotnet build APIbackend.slnx -c Release --no-restore

      - name: Run Unit Tests (Application.Tests)
        run: dotnet test tests/Application.Tests/Application.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Integration Tests (WebApi.IntegrationTests vía Docker)
        run: dotnet test tests/WebApi.IntegrationTests/WebApi.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Audit vulnerable packages
        run: dotnet list APIbackend.slnx package --vulnerable --include-transitive

